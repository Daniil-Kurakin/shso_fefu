[project]
name = "shso-fefu"
version = "0.1.0"
description = "Сайт Штаба студенческих отрядов ДВФУ"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<5.3",
  "psycopg[binary]>=3.2",
  "gunicorn>=23.0",
  "whitenoise>=6.8",
  "argon2-cffi>=23.1",
  "django-q2>=1.7",
  "redis>=5.0",
  "django-modeltranslation>=0.19",
  "pillow>=10.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "djlint>=1.36",
  "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-ra --strict-markers --reuse-db"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "C4", "SIM", "S"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "S105"]
"**/tests/*.py" = ["S101", "S105", "S106"]
"tests/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
ignore = "H006,H030,H031"
extend_exclude = "staticfiles,media"
